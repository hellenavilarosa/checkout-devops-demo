apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          # ~5 req/s against /checkout; prints status and response time per request
          # (status=000 means the client gave up: connection refused/reset or timeout)
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 5 http://checkout-api/checkout || echo "000 5.0")
                echo "$(date -u +%FT%TZ) checkout status=${out%% *} time=${out##* }s"
                sleep 0.2
              done
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
