apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: checkout

resources:
  - ../../base
  - namespace.yaml

# Production values. To inject a fault for the demo, change a value here,
# commit, and let ArgoCD sync. Examples:
#   REDIS_HOST=redis   -> dependency misconfig, /checkout returns 503
#   ERROR_RATE=0.6           -> partial failure, 60% of /checkout return 500
#   LATENCY_MS=1500          -> latency regression
configMapGenerator:
  - name: checkout-api-config
    behavior: merge
    literals:
      - REDIS_HOST=redis
      - ERROR_RATE=0
      - LATENCY_MS=20
      - APP_VERSION=1.0.0
