apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: checkout

resources:
  - ../../base
  - namespace.yaml
  - public-service.yaml

# Production values. Faults are injected by changing a value here, committing,
# and letting ArgoCD sync (never kubectl). Demo scenarios:
#   A) limits.memory 128Mi -> 56Mi  "right-sizing" -> OOMKilled, restarts, partial failures
#   B) FRAUD_CHECK_URL=http://10.255.255.1:8443/score  slow upstream -> p99 latency, errors stay low
#   Simpler faults that also work: REDIS_HOST=redis-cache, ERROR_RATE=0.6, LATENCY_MS=1500
configMapGenerator:
  - name: checkout-api-config
    behavior: merge
    literals:
      - REDIS_HOST=redis
      - ERROR_RATE=0
      - LATENCY_MS=20
      - APP_VERSION=1.0.0
      - FRAUD_CHECK_URL=
      - FRAUD_CHECK_TIMEOUT_MS=3000

patches:
  - target:
      kind: Deployment
      name: checkout-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 48Mi
          limits:
            cpu: 250m
            memory: 56Mi
