apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - redis.yaml
  - checkout-api.yaml
  - loadgen.yaml

# App source is shipped as a ConfigMap so no image build/registry is needed.
configMapGenerator:
  - name: checkout-api-code
    files:
      - server.py=app/server.py
  # Runtime knobs. Overlays patch this; faults are injected by changing
  # these values in Git and letting ArgoCD sync.
  - name: checkout-api-config
    literals:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ERROR_RATE=0
      - LATENCY_MS=20
      - APP_VERSION=1.0.0

commonLabels:
  app.kubernetes.io/part-of: checkout

# Project tag on metadata + pod templates only (not on selectors, which are immutable)
labels:
  - pairs:
      project: checkout-api
      owner: platform-team
    includeSelectors: false
    includeTemplates: true
